[package]
name = "sync-iobs"
version = "0.1.7"
edition = "2021"
description = "iobs 文件双向同步命令行工具（上传/下载 + 实时进度）"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

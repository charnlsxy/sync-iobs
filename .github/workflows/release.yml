name: Build & Release

# 只认 tag：分支推送（main / master）和 PR 都不再触发，避免同一个 commit 被跑两遍。
# 唯一的自动部署入口就是推 v* tag，跑一次完整流程：test → build(win/mac) → release
on:
  push:
    tags: ["v*"]
  # 手动触发：只跑测试与编译，**不会发版**（release job 有 refs/tags 判断），
  # 用于不发版时验证代码能否在各平台编译通过
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 构建产物统一放到这个目录，便于打包
  OUT_DIR: out

jobs:
  # ============ 1. 代码检查与测试 ============
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux deps (OpenGL / X11 for eframe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: cargo test
        run: cargo test --locked

      - name: cargo build (no-default-features, CLI only)
        run: cargo build --locked --no-default-features

  # ============ 2. Windows 构建 ============
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock') }}

      # GUI 版：默认 feature（eframe + rfd）
      # 注意：GUI 与 CLI 编译产物同名（sync-iobs.exe），必须编完立刻改名拷走，
      # 否则后一次编译会覆盖前一次，导致 gui 包里装的是 CLI。
      - name: Build GUI (static CRT)
        shell: bash
        run: |
          set -eu
          TARGET=x86_64-pc-windows-msvc
          cargo build --locked --release --target "$TARGET"
          mkdir -p staging
          cp "target/$TARGET/release/sync-iobs.exe" staging/sync-iobs-gui.exe
          ls -l staging/sync-iobs-gui.exe

      # CLI 版：零 GUI 依赖，产物小
      - name: Build CLI (no-default-features, static CRT)
        shell: bash
        run: |
          set -eu
          TARGET=x86_64-pc-windows-msvc
          cargo build --locked --release --no-default-features --target "$TARGET"
          cp "target/$TARGET/release/sync-iobs.exe" staging/sync-iobs-cli.exe
          ls -l staging/

      - name: Verify GUI build actually contains the GUI
        shell: bash
        run: |
          set -eu
          GUI=$(stat -c%s staging/sync-iobs-gui.exe)
          CLI=$(stat -c%s staging/sync-iobs-cli.exe)
          echo "GUI=$GUI bytes, CLI=$CLI bytes"
          if [ "$GUI" -le "$CLI" ]; then
            echo "::error::GUI 产物不大于 CLI 产物，说明 GUI feature 未生效（可能被覆盖）"
            exit 1
          fi
          echo "尺寸校验通过：GUI 明显大于 CLI"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null

          # GUI 包：GUI 二进制 + 配置模板 + 启动脚本
          # 注意：只打包脱敏模板 iobs.ini.example，绝不打包含真实凭据的 iobs.ini
          $pkg = 'pkg-gui'
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item 'staging/sync-iobs-gui.exe' "$pkg/sync-iobs.exe"
          Copy-Item 'iobs.ini.example' "$pkg/iobs.ini"

          # bat 用 CRLF 换行，Windows 下双击才正常
          $gui = "@echo off`r`n`"%~dp0sync-iobs.exe`"`r`n"
          $cli = "@echo off`r`n`"%~dp0sync-iobs.exe`" %*`r`n"
          [IO.File]::WriteAllText((Join-Path $pwd "$pkg/run-gui.bat"), $gui)
          [IO.File]::WriteAllText((Join-Path $pwd "$pkg/run-cli.bat"), $cli)

          Compress-Archive -Path "$pkg/*" -DestinationPath "$env:OUT_DIR/sync-iobs-windows-x86_64-gui.zip" -Force

          # CLI 单文件
          Copy-Item 'staging/sync-iobs-cli.exe' "$env:OUT_DIR/sync-iobs-windows-x86_64-cli.exe"

          Get-ChildItem $env:OUT_DIR | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.OUT_DIR }}/*
          if-no-files-found: error

  # ============ 3. macOS 双架构构建 ============
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M 系列）。macos-14 是当前稳定可用的 arm64 标签
          - arch: aarch64-apple-darwin
            runner: macos-14
            label: arm64
          # Intel 芯片。注意：macos-13 已于 2025-12-08 退役，
          # Intel 必须使用 macos-15-intel（官方最后一个 x86_64 镜像，支持到 2027-08）
          - arch: x86_64-apple-darwin
            runner: macos-15-intel
            label: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 注意：GUI 与 CLI 编译产物同名（release/sync-iobs），必须编完立刻拷走，
      # 否则后一次编译会覆盖前一次，导致 gui 包里装的是 CLI。
      - name: Build GUI
        run: |
          set -eu
          T="${{ matrix.arch }}"
          cargo build --locked --release --target "$T"
          mkdir -p staging
          cp "target/$T/release/sync-iobs" staging/sync-iobs-gui
          chmod +x staging/sync-iobs-gui
          ls -l staging/sync-iobs-gui

      - name: Build CLI (no-default-features)
        run: |
          set -eu
          T="${{ matrix.arch }}"
          cargo build --locked --release --no-default-features --target "$T"
          cp "target/$T/release/sync-iobs" staging/sync-iobs-cli
          chmod +x staging/sync-iobs-cli
          ls -l staging/

      - name: Verify GUI build actually contains the GUI
        run: |
          set -eu
          GUI=$(stat -f%z staging/sync-iobs-gui)
          CLI=$(stat -f%z staging/sync-iobs-cli)
          echo "GUI=$GUI bytes, CLI=$CLI bytes"
          if [ "$GUI" -le "$CLI" ]; then
            echo "::error::GUI 产物不大于 CLI 产物，说明 GUI feature 未生效（可能被覆盖）"
            exit 1
          fi
          echo "尺寸校验通过：GUI 明显大于 CLI"

      - name: Package
        run: |
          set -eu
          mkdir -p "$OUT_DIR"
          L="${{ matrix.label }}"
          # 版本号从 Cargo.toml 读取，避免与 tag 不一致
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "打包版本：$VER"
          # GUI 包：app bundle 形式，双击即用
          rm -rf "SyncIOBS.app"
          mkdir -p "SyncIOBS.app/Contents/MacOS" "SyncIOBS.app/Contents/Resources"
          cp "staging/sync-iobs-gui" "SyncIOBS.app/Contents/MacOS/SyncIOBS"
          chmod +x "SyncIOBS.app/Contents/MacOS/SyncIOBS"
          cp iobs.ini.example "SyncIOBS.app/Contents/Resources/iobs.ini"
          # Info.plist：逐行 printf 输出，避免 heredoc 缩进残留
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>SyncIOBS</string>' \
            '  <key>CFBundleDisplayName</key><string>Sync IOBS</string>' \
            "  <key>CFBundleIdentifier</key><string>com.example.sync-iobs</string>" \
            "  <key>CFBundleVersion</key><string>$VER</string>" \
            "  <key>CFBundleShortVersionString</key><string>$VER</string>" \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '  <key>CFBundleExecutable</key><string>SyncIOBS</string>' \
            '  <key>LSMinimumSystemVersion</key><string>10.15</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "SyncIOBS.app/Contents/Info.plist"
          # 校验 plist 合法性（不合法会让 app 无法启动）
          plutil -lint "SyncIOBS.app/Contents/Info.plist"
          zip -qry "$OUT_DIR/sync-iobs-macos-$L-gui.zip" "SyncIOBS.app"
          # CLI 单文件
          cp "staging/sync-iobs-cli" "$OUT_DIR/sync-iobs-macos-$L-cli"
          chmod +x "$OUT_DIR/sync-iobs-macos-$L-cli"
          ls -lh "$OUT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: ${{ env.OUT_DIR }}/*
          if-no-files-found: error

  # ============ 4. 发布 Release ============
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      # 防止 tag 名与 Cargo.toml 版本号对不上（如打了 v0.2.0 但代码还是 0.1.0）
      - name: Check tag matches Cargo.toml version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  Cargo.toml=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag 名（v$TAG）与 Cargo.toml 版本（$VER）不一致，请先同步版本号"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files
        run: ls -lhR artifacts

      - name: Verify GUI packages really contain a GUI build
        run: |
          set -eu
          cd artifacts
          # Windows：gui.zip 里的 exe 必须远大于 cli.exe，且含 GUI 依赖特征
          WIN_CLI=$(stat -c%s sync-iobs-windows-x86_64-cli.exe)
          unzip -o -q sync-iobs-windows-x86_64-gui.zip -d _win
          WIN_GUI=$(stat -c%s _win/sync-iobs.exe)
          echo "Windows: cli=$WIN_CLI  gui=$WIN_GUI"
          if [ "$WIN_GUI" -le "$WIN_CLI" ]; then
            echo "::error::Windows gui 包内 exe 不大于 cli，GUI feature 可能未生效"
            exit 1
          fi
          for sym in egui eframe winit glutin; do
            if ! grep -qi "$sym" _win/sync-iobs.exe; then
              echo "::error::Windows gui 包内 exe 缺少 GUI 特征串：$sym"
              exit 1
            fi
          done
          # macOS：cli 单文件必须明显小于 gui 包内的可执行文件
          for L in arm64 x86_64; do
            MC=$(stat -c%s "sync-iobs-macos-$L-cli" 2>/dev/null || stat -f%z "sync-iobs-macos-$L-cli")
            rm -rf "_mac_$L"; mkdir -p "_mac_$L"
            unzip -o -q "sync-iobs-macos-$L-gui.zip" -d "_mac_$L"
            MG=$(stat -c%s "_mac_$L/SyncIOBS.app/Contents/MacOS/SyncIOBS" 2>/dev/null || stat -f%z "_mac_$L/SyncIOBS.app/Contents/MacOS/SyncIOBS")
            echo "macOS-$L: cli=$MC  gui=$MG"
            if [ "$MG" -le "$MC" ]; then
              echo "::error::macOS $L gui 包内可执行文件不大于 cli，GUI feature 可能未生效"
              exit 1
            fi
          done
          rm -rf _win _mac_arm64 _mac_x86_64
          echo "GUI 包校验通过"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
